services:
  bariukas-api:
    image: bariukas-api
    container_name: bariukas-api
    build:
      context: .
      dockerfile: BariukasApi/Dockerfile
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:8.0.4
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: local-user
      MONGO_INITDB_ROOT_PASSWORD: local-password
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: